name: family-shield
on:
  push:
    paths:
      - "shield/**"
      - ".github/workflows/shield.yml"
  pull_request:
    paths:
      - "shield/**"
      - ".github/workflows/shield.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: shield

jobs:
  shared-and-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: family-shield-server-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write # rolling "server-latest" release used by deploy/install.sh
    env:
      SHIELD_SERVER_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (shared engines + server)
        run: ./gradlew --no-daemon :shared:test :server:test
      - name: Server jar
        run: ./gradlew --no-daemon :server:fatJar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-server-test-reports
          path: |
            shield/shared/build/reports/tests
            shield/server/build/reports/tests
      - uses: actions/upload-artifact@v4
        with:
          name: family-shield-server
          path: shield/server/build/libs/family-shield-server.jar
      - name: Publish server jar for deploy/install.sh
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/cool-gates-wyu9vs')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=server/build/libs/family-shield-server.jar
          notes="Server jar built from ${GITHUB_SHA} (${GITHUB_REF_NAME}). Downloaded by shield/deploy/install.sh."
          if gh release view server-latest >/dev/null 2>&1; then
            gh release upload server-latest "$jar" --clobber
            gh release edit server-latest --notes "$notes"
          else
            gh release create server-latest "$jar" --prerelease --target "$GITHUB_SHA" --title "Family Shield server" --notes "$notes"
          fi

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: family-shield-android-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.SHIELD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shield.jks"
            echo "SHIELD_STORE_FILE=$RUNNER_TEMP/shield.jks" >> "$GITHUB_ENV"
          else
            echo "No keystore secret: release APK will be signed with the debug key."
          fi
      - name: Unit tests, lint, release build
        env:
          SHIELD_STORE_PASSWORD: ${{ secrets.SHIELD_STORE_PASSWORD }}
          SHIELD_KEY_ALIAS: ${{ secrets.SHIELD_KEY_ALIAS }}
          SHIELD_KEY_PASSWORD: ${{ secrets.SHIELD_KEY_PASSWORD }}
          SHIELD_SERVER_URL: ${{ vars.SHIELD_SERVER_URL }}
          SHIELD_ENTITLEMENT_PUBLIC_KEY: ${{ vars.SHIELD_ENTITLEMENT_PUBLIC_KEY }}
          RUSTORE_CONSOLE_APP_ID: ${{ vars.RUSTORE_CONSOLE_APP_ID }}
          RUSTORE_PUSH_PROJECT_ID: ${{ vars.RUSTORE_PUSH_PROJECT_ID }}
          SHIELD_SUPPORT_EMAIL: ${{ vars.SHIELD_SUPPORT_EMAIL }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            shield/app/build/reports
      - uses: actions/upload-artifact@v4
        with:
          name: family-shield-release
          path: |
            shield/app/build/outputs/apk/release/*.apk
            shield/app/build/outputs/bundle/release/*.aab

  # Installs or updates the production server over SSH with deploy/install.sh, after the
  # server jar for this commit is published. Needs the SERVER_PASSWORD (or SERVER_SSH_KEY)
  # secret; host and domain can be overridden with the SERVER_HOST / SHIELD_DOMAIN variables.
  deploy:
    needs: shared-and-server
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/cool-gates-wyu9vs')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: family-shield-deploy
      cancel-in-progress: false
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST || '188.120.246.123' }}
      SERVER_USER: ${{ vars.SERVER_USER || 'root' }}
      SHIELD_DOMAIN: ${{ vars.SHIELD_DOMAIN || 'familyapp1.ru' }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install / update the server
        run: |
          if [ -z "$SERVER_PASSWORD$SERVER_SSH_KEY" ]; then
            echo "::warning::Deploy skipped: add the SERVER_PASSWORD secret (Settings → Secrets and variables → Actions)."
            exit 0
          fi
          ssh_opts=(-o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ConnectTimeout=20)
          if [ -n "$SERVER_SSH_KEY" ]; then
            install -m 600 /dev/null ~/.ssh_deploy_key
            printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh_deploy_key
            run() { ssh "${ssh_opts[@]}" -i ~/.ssh_deploy_key "$SERVER_USER@$SERVER_HOST" "$@"; }
          else
            sudo apt-get install -y -qq sshpass >/dev/null
            export SSHPASS="$SERVER_PASSWORD"
            run() { sshpass -e ssh "${ssh_opts[@]}" -o PubkeyAuthentication=no "$SERVER_USER@$SERVER_HOST" "$@"; }
          fi
          run "cat > /root/family-shield-install.sh" < deploy/install.sh
          run "SHIELD_BRANCH='$GITHUB_REF_NAME' bash /root/family-shield-install.sh '$SHIELD_DOMAIN' < /dev/null"
      - name: Check from the internet
        if: env.SERVER_PASSWORD != '' || env.SERVER_SSH_KEY != ''
        run: |
          echo "DNS A $SHIELD_DOMAIN: $(dig +short A "$SHIELD_DOMAIN" | tr '\n' ' ')"
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 10 "https://$SHIELD_DOMAIN/health"; then
              echo
              echo "Entitlement public key: $(curl -fsS "https://$SHIELD_DOMAIN/v1/billing/public-key")"
              curl -fsS -o /dev/null -w "privacy page: %{http_code}\n" "https://$SHIELD_DOMAIN/privacy"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::https://$SHIELD_DOMAIN is not reachable yet (DNS records or HTTPS certificate pending)."
