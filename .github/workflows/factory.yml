name: ubt-factory-economy
on:
  schedule:
    # 17:17 Asia/Barnaul (UTC+7) requested; GitHub often starts schedules 1-3 h late. Formats rotate via factory/plan.py.
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      render_only:
        description: "Render only; publication additionally requires RELEASE_ENABLED"
        default: true
        type: boolean
      formats:
        description: 'Optional JSON format override, e.g. {"instagram":"reel","youtube":"skip"}'
        default: ""
        type: string
      check_only:
        description: "Only verify publishing credentials (no render, no posts)"
        default: false
        type: boolean
concurrency:
  group: ubt-factory
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  run:
    # Runs by default in safe render-only mode; set variable FACTORY_ENABLED=false to pause.
    # Publishing additionally requires RELEASE_ENABLED=true and Composio secrets.
    if: vars.FACTORY_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: factory/requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            voices
            factory/fonts
          key: media-v1
      - name: Install dependencies
        run: |
          set -o pipefail
          python -m pip install -r factory/requirements.txt
          python -m pip install pytest
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: Fetch fonts (cached after first run)
        run: python -c "import sys; sys.path.insert(0,'factory'); import render; render.ensure_fonts()"
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Validate topic bank
        run: python factory/briefs.py factory/topics.json /tmp/_lint && rm -rf /tmp/_lint
      - name: Preflight - publishing credentials
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
        run: python factory/run.py --check
      - name: Run one bounded package
        if: ${{ inputs.check_only != true }}
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ vars.COMPOSIO_USER_ID }}
          DEFAULT_PROJECT: ${{ vars.DEFAULT_PROJECT }}
          REQUEST_RENDER_ONLY: ${{ inputs.render_only }}
          FORMATS_OVERRIDE: ${{ inputs.formats }}
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ vars.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        run: |
          EXTRA="--render-only"
          RELEASE_ENABLED=$(printf '%s' "$RELEASE_ENABLED" | tr -d ' "\r\n' | sed 's/^RELEASE_ENABLED=//' | tr 'A-Z' 'a-z')
          export RELEASE_ENABLED
          if [ "$RELEASE_ENABLED" = "true" ] && [ "$REQUEST_RENDER_ONLY" != "true" ]; then EXTRA=""; fi
          python factory/run.py --max-scripts 1 $EXTRA
